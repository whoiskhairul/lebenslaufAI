<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LebenslaufAI — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">L</div>
      <h1>LebenslaufAI Job Tailorer</h1>
    </div>

    <section>
      <h2>Server</h2>
      <div class="row">
        <button id="useLocal" class="btn">Use Local</button>
        <button id="useProd" class="btn">Use Production</button>
      </div>
      <label>
        API base URL
        <input id="apiBase" type="url" placeholder="API base URL" />
      </label>
      <label>
        Web app URL (where generated CVs open)
        <input id="appUrl" type="url" placeholder="Web app URL" />
      </label>
      <button id="saveServer" class="btn">Save URLs</button>
      <p id="serverMsg" class="note hidden"></p>
    </section>

    <section class="mutedbox">
      <h2>How it works</h2>
      <ol>
        <li>Open a job posting on LinkedIn, Xing or Indeed.</li>
        <li>Click the extension button → <strong>⚡ Tailor this job</strong>.</li>
        <li>The editor opens pre-filled. Sign in on the website if asked — the job data is kept and restored after login.</li>
      </ol>
    </section>
  </div>
  <script src="../config.js"></script>
  <script src="options.js"></script>
</body>
</html>
